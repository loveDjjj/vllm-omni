# HunyuanImage-3.0-Instruct-Distil Dense teacher trajectory capture on 8 Ascend NPUs.
pipeline: hunyuan_image3_dit
async_chunk: false

stages:
  - stage_id: 0
    max_num_seqs: 1
    gpu_memory_utilization: 0.8
    enforce_eager: true
    devices: "0,1,2,3,4,5,6,7"
    distributed_executor_backend: "mp"
    cache_backend:
    diffusion_attention_config:
      default:
        backend: TORCH_SDPA
      per_role:
        hunyuan.ar:
          backend: TORCH_SDPA
        hunyuan.diffusion:
          backend: TORCH_SDPA
    parallel_config:
      tensor_parallel_size: 8
      enable_expert_parallel: true
      sequence_parallel_size: 1
      ulysses_degree: 1
      ring_degree: 1
      allgather_degree: 1
      cfg_parallel_size: 1
    default_sampling_params:
      num_inference_steps: 8
      guidance_scale: 2.5
      seed: 42
      return_teacher_trajectory: true
